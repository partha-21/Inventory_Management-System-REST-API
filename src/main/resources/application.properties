# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Datasource
# Create the database first:  CREATE DATABASE inventory_db;
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ddl-auto=update is fine for development; use Flyway/Liquibase migrations for production
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Required so data.sql runs AFTER Hibernate creates the schema (not before) —
# without this, data.sql fails with "table doesn't exist" on first run.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Log how many queries Hibernate actually fires — use this to catch N+1 problems yourself
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==============================
# Swagger / OpenAPI UI
# Once running, browse: http://localhost:8080/swagger-ui.html
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
